version: '3.8'

services:
  calculator-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${DOCKER_IMAGE:-calculator-api}:${IMAGE_TAG:-latest}
    container_name: calculator-api
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_PORT=8080
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - calc-network

  nginx-proxy:
    image: nginx:alpine
    container_name: calculator-proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      calculator-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:80/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - calc-network

networks:
  calc-network:
    driver: bridge
